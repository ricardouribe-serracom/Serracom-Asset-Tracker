<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Tags">
<meta name="theme-color" content="#00456F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });</script>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<title>Serracom Asset Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Serracom navy #00456F + orange #FF6600. Red stays for warnings and open red tags. */
/* Layout: phone-first single column (max 880px), sticky header with market switch, fixed bottom tab bar; swap records drawn as hang tags */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#1B2228; --muted:#5A6670; --line:#D3D9DF;
  --crit:#C21F2E; --crit-soft:#F8E1E3; --brand:#00456F; --brand-hd:#00456F; --accent:#FF6600; --accent-btn:#C24E00; --on-accent:#FFFFFF; --head:#00456F; --chart:#00456F; --ok:#1E7448; --ok-soft:#DDEFE5; --warn:#9A5B00; --warn-soft:#F6EAD2; --chip:#E1E6EA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-hd)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.88em;letter-spacing:.02em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand-hd);color:#fff;border-bottom:3px solid var(--accent);
  margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding:10px var(--gut-r) 10px var(--gut-l)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{flex:none;display:block;height:40px;width:auto}
.brand h1{font-size:24px;text-transform:uppercase}
.brand small{display:block;color:rgba(255,255,255,.78);font-size:12px;font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:400}
.top-in .sp{flex:1}
.mkt{display:inline-grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:3px}
.mkt button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85);cursor:pointer;white-space:nowrap}
.mkt button[aria-pressed="true"]{background:#fff;color:#00456F;box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:880px;margin:0 auto;padding-top:14px;display:grid;gap:22px}
.live{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.stale{background:var(--warn)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none}
.ghost:hover{color:var(--ink)}
section{display:grid;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.sec-h h2{font-size:22px;text-transform:uppercase;color:var(--head)}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stat .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hot .v{color:var(--crit)}

.flags{display:grid;gap:8px}
.flag{display:grid;grid-template-columns:6px minmax(0,1fr);background:var(--surface);border-radius:8px;overflow:hidden}
.flag i{background:var(--warn)}
.flag.crit i{background:var(--crit)}
.flag div{padding:10px 14px;min-width:0}
.flag strong{display:block;font-weight:600}
.flag span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.allclear{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 14px;font-weight:500}

.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.low{color:var(--warn);font-weight:600}
td .lowtag{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 6px;margin-left:6px;letter-spacing:.04em}

.bars{background:var(--surface);border-radius:10px;padding:14px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center}
.bar .n{font-size:13px;min-width:0}
.bar .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;grid-row:span 2}
.bar .track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--chart);border-radius:4px}

.controls{display:grid;gap:10px}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.model{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;background:var(--chip);border-radius:4px;padding:0 6px}

.list{display:grid;gap:6px}
.row{background:var(--surface);border-radius:10px;padding:10px 14px;display:grid;gap:4px}
.row .main{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.row .sub{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 7px;white-space:nowrap}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);background:var(--surface);border-radius:10px;padding:18px;text-align:center}

.tags{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.tag{position:relative;background:var(--surface);padding:14px 16px 14px 40px;display:grid;gap:8px;min-width:0;align-content:start;
  clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.tag::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--crit)}
.tag.done::before{box-shadow:0 0 0 3px var(--line)}
.tag .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag .site{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.03em}
.tag .date{margin-left:auto;font-size:12px;color:var(--muted)}
.tag dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:13px}
.tag dt{color:var(--muted)}
.tag dd{margin:0;overflow-wrap:anywhere}
.tag .t3{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:13px}
.tag .t3 a{color:var(--muted)}

.panel{background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel label{display:grid;gap:4px;font-size:13px;font-weight:500}
.panel input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:15px}
.verdict{border-radius:8px;padding:10px 12px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--crit-soft);color:var(--crit)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.hits{display:grid;gap:4px;font-size:14px;margin:0;padding-left:18px}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;text-align:center}
.btn.red{background:var(--accent-btn);color:var(--on-accent)}
.btn.quiet{background:var(--chip);color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.state{background:var(--surface);border-radius:12px;padding:22px 18px;display:grid;gap:10px;justify-items:start}
.state h2{font-size:24px;text-transform:uppercase}
.state p{margin:0;max-width:60ch;color:var(--muted)}
.state.err h2{color:var(--crit)}
.skel{height:12px;border-radius:6px;background:var(--chip);width:100%}
.skel.s{width:60%}
@media (prefers-reduced-motion: no-preference){ .skel{animation:pulse 1.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.5}} }
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.tabs-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:none;border:0;border-radius:10px;padding:6px 4px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--head);background:var(--chip);box-shadow:inset 0 3px 0 var(--accent)}
.tabs button.tool{color:var(--accent-btn)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--crit);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:9;max-width:calc(100% - 32px)}

/* forms and edit controls */
form{background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:14px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
form label{display:grid;gap:4px;font-size:13px;font-weight:500;min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:12px;min-height:1em}
.hint.err{color:var(--crit)}
.hint.ok{color:var(--ok)}
form input[type=text],form select,form textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
form input.mono{font-family:var(--mono);font-size:14px}
form textarea{min-height:64px;resize:vertical}
.check{display:flex !important;grid-template-columns:none;align-items:center;gap:8px;font-weight:400 !important}
.check input{width:18px;height:18px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos label{display:grid;gap:6px;justify-items:start}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--chip)}
.formerr{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:10px 12px;font-size:14px}
.row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.row .main,.row .sub{grid-column:1}
.row .move{grid-column:2;grid-row:1/span 2;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;max-width:44vw}
.tag img.ph{width:56px;height:56px;object-fit:cover;border-radius:6px;background:var(--chip)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.who{color:var(--muted)}

html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
input,select,textarea{font-size:16px}

.sfield{display:grid;gap:4px;font-size:13px;font-weight:500;min-width:0}
.srow{display:flex;gap:8px;align-items:stretch;min-width:0}
.srow input{flex:1;min-width:0;width:auto}
.scanbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
input[readonly][data-mode="scan"]{background:var(--surface);border-style:dashed;cursor:default}
input[readonly][data-mode="scan"]:not(:placeholder-shown){border-style:solid;font-weight:600}
.sfield input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:var(--mono)}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--muted);font-size:12px;font-weight:400;text-decoration:underline;cursor:pointer;justify-self:start}
.linkbtn:hover{color:var(--ink)}
.scan-ov{position:fixed;inset:0;z-index:30;background:rgba(8,12,16,.6);display:grid;place-items:center;padding:16px}
.scan-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:100%;max-width:380px;display:grid;gap:12px}
.scan-card h3{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0;letter-spacing:.01em}
.scan-card p{margin:0}
.choices{display:grid;gap:8px}
.check-out{background:var(--surface);border-radius:10px;padding:12px 14px;display:grid;gap:8px}

/* sign-in, account, transfer destination, installs */
.signin{max-width:440px;margin:8px auto 0;width:100%}
.signin label{width:100%}
.signin input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
.codein{font-size:26px;letter-spacing:.3em;text-align:center}
.signin .btn{width:100%;padding:12px}
.signin .actions{display:flex;flex-wrap:wrap;gap:4px 16px;width:100%;justify-content:space-between}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--brand);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.acct{background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.acct div{display:grid}
.acct span{color:var(--muted);font-size:13px}
fieldset.dest{border:0;margin:0;padding:0;min-width:0}
fieldset.dest legend{font-weight:600;font-size:13px;padding:0;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:block;cursor:pointer;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;gap:2px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-weight:600;text-align:center}
.seg small{font-weight:400;color:var(--muted);font-size:12px}
.seg input:checked+span{border-color:var(--brand);background:#E6EEF4;color:var(--brand);box-shadow:inset 0 -3px 0 var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg input:disabled+span{opacity:.5;cursor:not-allowed}
.site-id{font-family:var(--mono);font-weight:500;color:var(--brand)}
#instSec .search{margin-bottom:10px;width:100%}
body{padding-top:env(safe-area-inset-top,0px)}
.scan-ov.live .scan-card{max-width:460px}
.viewfinder{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;width:100%}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .aim{position:absolute;inset:14% 10%;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.32)}
@media (prefers-reduced-motion: no-preference){ .viewfinder .aim{animation:aim 1.6s ease-in-out infinite} @keyframes aim{50%{border-color:#fff}} }
</style>
</head>
<body>
<header class="top">

<script>
(function(){
var REASONS=["Will Not Power Up","Fault/OSS Alarms will not clear","RF Intermittent Performance/RTWP/VSWR","Cannot Detect/Access","Heat Related (Fan Failure)","Unstable/Resets","Damage Port/Connector/Interface","Physically Defective (non-connectors and interface)","Cannot Load Software","Cannot Upgrade Due to Hardware Version Level","Failed Light Test/Will Not Pass Light (Hybrid/Fiber Jumpers)","Water in unit"];
var MARKETS={AU:{name:"AU",store:"AU WAREHOUSE",sitePh:"TK02047"},HN:{name:"HN",store:"HN WAREHOUSE",sitePh:"A3H0170A"}};
var NOT_SPARE=["SITE","TELLWORKS"];
var DEFAULT_MODELS=["AEHC","AAFIA","AHLOA","AHFIG","AHLOB","AHFII","FXFC","FXFB","AVHA"];
var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
var cur=MARKETS[store.get("rtt-market")]?store.get("rtt-market"):"AU";
var token=store.get("rtt-token")||"", user=null, isMgr=false, team={};
var data=null, raw=null, state={phase:token?"loading":"signin",msg:""}, lastLoad=0, loading=false, LOOKUP={};
var signStep="email", signEmail=store.get("rtt-email")||"";
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var S=function(v){return v==null?"":String(v).trim();};
var SN=function(v){return S(v).toUpperCase().replace(/\s+/g,"").replace(/^\(S\)/,"");};
var H=function(v){return S(v).toUpperCase();};
function title(s){ return S(s).toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();}).replace(/\b(Au|Hn|Jr)\b/g,function(x){return x.toUpperCase();}); }
function normSite(s,m){ s=S(s).toUpperCase().replace(/\s+/g,""); if(m!=="AU") return s; var x=s.match(/^([A-Z]{2})0*(\d{1,5})([A-Z]?)$/); return x? x[1]+x[2].padStart(5,"0")+x[3] : s; }
/** What a barcode says: a radio label (product code + serial), a serial, or an asset tag. */
function parseCode(text){
  var raw=String(text==null?"":text).replace(/\u241D|<GS>/gi,"\x1d").replace(/\u241E|<RS>/gi,"\x1e").replace(/\u2404|<EOT>/gi,"\x04");
  var flat=raw.replace(/[\x00-\x1f]/g,"").trim(), up=flat.toUpperCase(), m;
  var out={raw:raw,flat:flat,serial:"",code:"",model:"",asset:""};
  if(/[\x1d\x1e\x04]/.test(raw)){
    raw.split(/[\x1d\x1e\x04]/).forEach(function(f){ f=f.replace(/[\x00-\x1f]/g,"").trim().toUpperCase();
      if((m=f.match(/^1P(\d{6})/))) out.code=out.code||m[1];
      else if((m=f.match(/^S([A-Z0-9]{8,14})$/))) out.serial=out.serial||m[1]; });
  }
  if(!out.serial&&(m=up.match(/1P(\d{6})[A-Z]?\.?\d*S([A-Z0-9]{11})/))){ out.code=m[1]; out.serial=m[2]; }
  if(!out.serial&&!out.code){
    var c=up.replace(/^\(S\)/,"").replace(/[^A-Z0-9]/g,"");
    if(/^1P\d{6}/.test(c)) out.code=c.slice(2,8);
    else if(/^TM[A-Z0-9]{6,10}$/.test(c)) out.asset=c;
    else if(/^S[A-Z0-9]{11}$/.test(c)) out.serial=c.slice(1);
    else if(/^[A-Z0-9]{11}$/.test(c)) out.serial=c;
  }
  if(out.code) out.model=LOOKUP[out.code]||"";
  return out;
}
function parseScan(v){ var p=parseCode(v); return p.serial? {model:p.model,sn:p.serial,code:p.code,raw:p.flat} : null; }
function toDate(v){ if(!v) return null; var d=new Date(v); return isNaN(d)?null:d; }
function fmtDate(d){ return d? d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "No date"; }
function ago(t){ if(!t) return ""; var s=Math.max(0,Math.round((Date.now()-t)/1000)); if(s<60) return "just now"; var m=Math.round(s/60); if(m<60) return m+" min ago"; var h=Math.round(m/60); return h<24? h+" hr ago" : Math.round(h/24)+" days ago"; }
function hidx(h,names){ for(var i=0;i<names.length;i++){ var j=h.indexOf(names[i]); if(j>=0) return j; } return -1; }
var toastTimer;
function toast(msg){ var h=document.getElementById("toastHost"); h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toastTimer); toastTimer=setTimeout(function(){h.innerHTML="";},3000); }
function run(fn){ var args=[].slice.call(arguments,1);
  if(window.google&&google.script&&google.script.run) return new Promise(function(res,rej){ var r=google.script.run.withSuccessHandler(function(x){ try{res(typeof x==="string"?JSON.parse(x):x);}catch(e){res(x);} }).withFailureHandler(rej); r[fn].apply(r,args); });
  var api=String(window.RTT_API||"").trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(api)) return Promise.reject(new Error(location.protocol==="https:"||location.protocol==="http:"?"NO_API":"NO_SCRIPT"));
  return fetch(api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args}),redirect:"follow"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP_"+r.status); return r.text(); })
    .then(function(t){ var o; try{ o=JSON.parse(t); }catch(e){ throw new Error("NOT_PUBLIC"); }
      if(!o||!o.ok) throw new Error(o&&o.error||"SERVER"); var x=o.val; try{ return typeof x==="string"?JSON.parse(x):x; }catch(e){ return x; } });
}
function errText(e){
  var m=String(e&&e.message||e||"");
  var after=function(k){ return m.split(k)[1].split(/["\n]/)[0]; };
  if(m.indexOf("MANAGERS_ONLY")>=0) return "Only managers can do that.";
  if(m.indexOf("NOT_ON_TEAM")>=0) return "That email isn't on the team list. Ask a manager to add you on the Team tab.";
  if(m.indexOf("BAD_EMAIL")>=0) return "Enter your full work email.";
  if(m.indexOf("WAIT")>=0&&m.indexOf("lock")<0) return "A code was just sent. Wait a minute before asking for another.";
  if(m.indexOf("CODE_EXPIRED")>=0) return "That code expired. Ask for a new one.";
  if(m.indexOf("BAD_CODE")>=0) return "That code isn't right. Check the email and try again.";
  if(m.indexOf("TOO_MANY")>=0) return "Too many tries. Ask for a new code.";
  if(/too many times for one day: email/i.test(m)) return "The app hit Google's daily email limit. Try again tomorrow.";
  if(m.indexOf("IN_OTHER_MARKET:")>=0){ var o=after("IN_OTHER_MARKET:"); return "That radio is listed in "+o+" inventory. Switch to "+o+" at the top to move it."; }
  if(m.indexOf("ALREADY_THERE:")>=0) return "That radio is already at "+title(after("ALREADY_THERE:"))+".";
  if(m.indexOf("NOT_IN_INVENTORY")>=0) return "That radio isn't in inventory. Bring it in with Asset Transfer on the Inventory tab first.";
  if(m.indexOf("ALREADY_INSTALLED:")>=0) return "That radio is already installed at "+after("ALREADY_INSTALLED:")+".";
  if(m.indexOf("NOT_GOOD")>=0) return "That radio is marked bad. Pick a good spare.";
  if(m.indexOf("NO_TRUCK")>=0) return "You don't have a truck on the Team tab. Ask a manager to add it.";
  if(m.indexOf("NOT_FOUND")>=0) return "That row moved in the sheet. Refresh and try again.";
  if(m.indexOf("BAD_SERIAL")>=0) return "Serials use only letters and numbers.";
  if(m.indexOf("NO_TAB:")>=0) return "The sheet is missing the \""+after("NO_TAB:")+"\" tab. Run setupTabs again.";
  if(m.indexOf("MISSING:")>=0) return "A required field is empty.";
  if(m.indexOf("AUTH")>=0) return "Please sign in again.";
  if(m.indexOf("Lock")>=0||m.indexOf("lock")>=0) return "Someone else is saving right now. Try again in a few seconds.";
  if(m.indexOf("NO_API")>=0) return "This app isn't linked to the sheet yet. Add the web app link to config.js.";
  if(m.indexOf("NOT_PUBLIC")>=0) return "The sheet link isn't open to everyone. In Apps Script set Who has access to Anyone, then deploy a new version.";
  if(m.indexOf("NO_SCRIPT")>=0) return "Open this page from the web app link.";
  return "Couldn't reach the sheet. Check your signal and try again.";
}
function isAuthErr(e){ return /\bAUTH\b/.test(String(e&&e.message||e||"")); }
function nameOf(email){ var e=S(email).toLowerCase(); if(team[e]) return team[e].name; if(e.indexOf("@")>0) return title(e.split("@")[0].replace(/[._]+/g," ").replace(/\d+/g,"").trim()); return S(email); }
function myTruck(){ if(!user) return ""; return H(user.truck)||(user.name?H(user.name.split(/\s+/)[0])+" TRUCK":""); }

/* ---------- parse the sheet ---------- */
function build(r){
  LOOKUP={}; (r.lookup||[]).slice(1).forEach(function(x){ var c=S(x[0]).replace(/\.0+$/,""), m=S(x[1]); if(c&&m) LOOKUP[c]=m; });
  var out={models:(r.models&&r.models.length?r.models:DEFAULT_MODELS),locations:r.locations||{}};
  Object.keys(MARKETS).forEach(function(m){ out[m]=buildMarket(m,r.markets[m]||{}); });
  return out;
}
function buildMarket(m,t){
  var res={inv:null,tags:[]};
  if(t.inv&&t.inv.length){
    var h=t.inv[0].map(H), c={st:hidx(h,["STATUS"]),md:hidx(h,["RADIO"]),nt:hidx(h,["NOTES"]),loc:hidx(h,["LOCATION"]),sn:hidx(h,["SERIAL NUMBER"]),scan:hidx(h,["SCANNED SN"]),as:hidx(h,["ASSET NUMBER"]),sas:hidx(h,["SCANNED ASSET"]),by:hidx(h,["LAST MOVED BY"]),at:hidx(h,["LAST MOVED"]),ds:hidx(h,["DATE OF SCAN"])};
    res.inv=t.inv.slice(1).map(function(x,i){
      var scan=parseScan(x[c.scan]); var sn=SN(x[c.sn])||(scan&&scan.sn)||""; if(!sn) return null;
      var loc=H(x[c.loc]), note=S(x[c.nt]);
      return {row:i+2,status:H(x[c.st])||"GOOD",model:H(x[c.md])||(scan&&scan.model)||"UNKNOWN",loc:loc&&loc!=="???"?loc:"NO LOCATION",sn:sn,asset:SN(x[c.as])||SN(x[c.sas]),
        site:loc==="SITE"&&note?note.toUpperCase():(/^[A-Z]{2}\d|^A\d[A-Z]/i.test(note)?note.toUpperCase():""),
        by:c.by>=0?S(x[c.by]):"", at:toDate(c.at>=0?x[c.at]:"")||toDate(c.ds>=0?x[c.ds]:"")};
    }).filter(Boolean);
  }
  if(t.tags&&t.tags.length){
    var g=t.tags[0].map(H);
    var k={ts:hidx(g,["TIMESTAMP"]),md:hidx(g,["RADIO"]),site:hidx(g,["SITE ID"]),inc:hidx(g,["INC #","INC # / TT NUMBER"]),bad:hidx(g,["SERIAL NUMBER OR ASSET IF NO SN","SERIAL NUMBER"]),rs:hidx(g,["FAILURE REASON"]),st:hidx(g,["STATUS"]),
      p1:hidx(g,["SERIAL NUMBER PICTURE OR ASSET IF NO SN","SERIAL NUMBER PICTURE"]),p3:hidx(g,["ASSET NUMBER PICTURE"]),by:hidx(g,["EMAIL ADDRESS"]),nw:hidx(g,["NEW RADIO SN INSTALLED"]),p2:hidx(g,["NEW RADIO SN INSTALLED PICTURE"]),
      nt:g.findIndex(function(x){return x.indexOf("ALARM NOTES")===0;}), as:hidx(g,["ASSET NUMBER"])};
    var bad=t.bad||[], bh=(bad[0]||[]).map(H), bsn=hidx(bh,["SERIAL NUMBER"]), box=hidx(bh,["CHAT ORDER SUBMITTED?"]);
    var used={};
    res.tags=t.tags.slice(1).map(function(x,i){
      var d=toDate(x[k.ts]), b=SN(x[k.bad]), site=S(x[k.site]);
      if(!d||!b||!site||site.toLowerCase()==="test") return null;
      var row=i+2, ordered=null;
      if(box>=0&&bad[row-1]&&SN(bad[row-1][bsn])===b){ ordered=bad[row-1][box]===true; used[row]=1; }
      else if(box>=0){ for(var j=1;j<bad.length;j++){ if(!used[j+1]&&SN(bad[j][bsn])===b){ ordered=bad[j][box]===true; used[j+1]=1; break; } } }
      var inc=S(x[k.inc]).toUpperCase().replace(/_+$/,"");
      var photos=[[x[k.p1],"Pulled radio"],[x[k.p2],"New radio"],[x[k.p3],"Asset tag"]].filter(function(p){return /^https:\/\//.test(S(p[0]));}).map(function(p){return {url:S(p[0]),label:p[1]};});
      return {row:row,date:d,siteRaw:site,site:normSite(site,m),model:H(x[k.md]),ticket:/^\d+$/.test(inc)?"INC"+inc:inc,badSn:b,reason:S(x[k.rs]),notes:k.nt>=0?S(x[k.nt]):"",
        by:nameOf(x[k.by]),newSn:SN(x[k.nw]),asset:k.as>=0?SN(x[k.as]):"",photos:photos,ordered:ordered};
    }).filter(Boolean).sort(function(a,b){return b.date-a.date;});
  }
  return res;
}

/* ---------- checks ---------- */
function isSpare(r){ return r.status==="GOOD"&&NOT_SPARE.indexOf(r.loc)<0; }
function flags(m){
  var inv=data[m].inv, tg=data[m].tags, out=[], bySn={};
  (inv||[]).forEach(function(r){ bySn[r.sn]=r; });
  var open=tg.filter(function(t){return t.ordered===false;});
  if(open.length){ var o=open[open.length-1]; out.push({crit:true,title:open.length+(open.length>1?" swaps still need":" swap still needs")+" a replacement order",detail:"Oldest is "+o.site+" from "+fmtDate(o.date)+(isMgr?". Tap Mark order submitted on the Red tags tab once it's in.":". A manager marks it submitted once it's ordered.")}); }
  var missing=tg.filter(function(t){return t.ordered===null;});
  if(missing.length) out.push({crit:false,title:missing.length+" red tag"+(missing.length>1?"s aren't":" isn't")+" on the Bad Radios list",detail:missing.slice(0,4).map(function(t){return t.badSn+" at "+t.site;}).join(", ")});
  var g={}; tg.forEach(function(t){ var v=t.badSn; if(v&&v.length>=8&&!/^(N\/?A|NONE)$/.test(v)) (g[v]=g[v]||[]).push(t); });
  Object.keys(g).filter(function(k){return g[k].length>1;}).forEach(function(sn){ var sites=[]; g[sn].forEach(function(t){ if(sites.indexOf(t.site)<0) sites.push(t.site); }); out.push({crit:false,title:"Bad radio "+sn+" tagged "+g[sn].length+" times",detail:"At "+sites.join(", ")+". Probably a duplicate entry."}); });
  if(inv){
    var pg=tg.filter(function(t){return bySn[t.badSn]&&(isSpare(bySn[t.badSn])||bySn[t.badSn].loc==="SITE");});
    if(pg.length) out.push({crit:true,title:pg.length+" pulled radio"+(pg.length>1?"s are":" is")+" still listed as good",detail:pg.map(function(t){return t.badSn+" (pulled from "+t.site+", listed at "+title(bySn[t.badSn].loc)+")";}).join("; ")+(isMgr?". Move them to Tellworks on the Inventory tab.":". A manager can move them to Tellworks.")});
    var dup={}; inv.forEach(function(r){ dup[r.sn]=(dup[r.sn]||0)+1; }); var dups=Object.keys(dup).filter(function(k){return dup[k]>1;});
    if(dups.length) out.push({crit:true,title:dups.length+" serial"+(dups.length>1?"s are":" is")+" listed more than once",detail:dups.slice(0,5).join(", ")+". Delete the extra row in the sheet."});
    var nl=inv.filter(function(r){return r.loc==="NO LOCATION";}); if(nl.length) out.push({crit:false,title:nl.length+" radio"+(nl.length>1?"s have":" has")+" no location",detail:nl.slice(0,5).map(function(r){return r.sn;}).join(", ")+(nl.length>5?"…":"")+". Scan them with Asset Transfer to set one."});
    var models=[]; inv.forEach(function(r){ if(r.model!=="UNKNOWN"&&models.indexOf(r.model)<0) models.push(r.model); });
    models.forEach(function(md){ var c=inv.filter(function(r){return r.model===md&&isSpare(r);}).length; if(c<2) out.push({crit:c===0,title:md+": "+(c===0?"no spares":"only 1 spare")+" on hand",detail:"Restock before the next swap."}); });
  }
  return out.sort(function(a,b){return b.crit-a.crit;});
}
function locsFor(m){
  var list=[], add=function(l){ l=H(l); if(l&&l!=="???"&&list.indexOf(l)<0) list.push(l); };
  add(MARKETS[m].store); (data.locations[m]||[]).forEach(add); (data[m].inv||[]).forEach(function(r){ add(r.loc); }); add("SITE"); add("TELLWORKS");
  var rank=function(x){ return x===MARKETS[m].store?0:(x.indexOf("WAREHOUSE")>=0||x.indexOf("STORAGE")>=0)?1:x==="SITE"?3:x==="TELLWORKS"?4:x==="NO LOCATION"?9:2; };
  return list.sort(function(a,b){ return rank(a)-rank(b)||a.localeCompare(b); });
}

/* ---------- loading ---------- */
function signedOut(msg){ token=""; store.set("rtt-token",""); user=null; isMgr=false; data=null; signStep="email"; state={phase:"signin",msg:msg||""}; render(); }
function load(quiet){
  if(!token){ signedOut(); return Promise.resolve(); }
  if(loading) return Promise.resolve(); loading=true;
  if(!quiet&&!data){ state={phase:"loading",msg:""}; render(); }
  return run("getData",token).then(function(r){
    raw=r; user=r.user; isMgr=user&&user.role==="MANAGER"; team={}; (r.team||[]).forEach(function(p){ team[S(p.email).toLowerCase()]=p; });
    if(r.book){ var sm=document.querySelector(".brand small"); if(sm) sm.textContent="Serracom · "+(user?user.name+" · ":"")+r.book; }
    data=build(r); lastLoad=Date.now(); state={phase:"ready",msg:""}; loading=false; onData();
    if(!zxWarm){ zxWarm=true; setTimeout(function(){ loadZW().catch(function(){}); },2500); }
  }).catch(function(e){ loading=false;
    if(isAuthErr(e)){ signedOut("You've been signed out. Sign in again to continue."); return; }
    if(data){ state={phase:"ready",msg:errText(e)}; onData(); } else { state={phase:"error",msg:errText(e)}; render(); } });
}
setInterval(function(){ if(document.visibilityState==="visible"&&state.phase==="ready"&&Date.now()-lastLoad>90000) load(true); },15000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&state.phase==="ready"&&Date.now()-lastLoad>30000) load(true); });

/* ---------- views ---------- */
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }
var app=document.getElementById("app");
function liveLine(){
  return '<div class="live" id="liveLine"><span class="dot'+(state.msg?" stale":"")+'"></span><span id="agoTxt">'+(state.msg?"Couldn't refresh · showing data from ":"Live from the sheet · updated ")+esc(ago(lastLoad))+'</span><button class="ghost" type="button" id="refreshBtn">Refresh</button></div>'+(state.msg?'<div class="banner">'+esc(state.msg)+'</div>':"");
}
setInterval(function(){ var a=document.getElementById("agoTxt"); if(a) a.textContent=(state.msg?"Couldn't refresh · showing data from ":"Live from the sheet · updated ")+ago(lastLoad); },30000);
function chrome(){ var on=!!user&&state.phase!=="signin"; document.querySelector("nav.tabs").hidden=!on; document.getElementById("mktSwitch").hidden=!on; }
function render(){
  updateBadge(); chrome();
  if(state.phase==="signin"){ viewSignIn(); return; }
  if(state.phase==="loading"){ app.innerHTML='<div class="state"><h2>Loading the sheet</h2><p>Getting inventory, installs and red tags.</p><div class="skel"></div><div class="skel s"></div><div class="skel"></div></div>'; return; }
  if(state.phase==="error"){ app.innerHTML='<div class="state err"><h2>Couldn\'t load the sheet</h2><p>'+esc(state.msg)+'</p><div class="actions"><button class="btn" type="button" id="retryBtn">Try again</button></div></div>'; document.getElementById("retryBtn").onclick=function(){load();}; return; }
  VIEWS[curView]();
  wireRefresh();
}
function wireRefresh(){ var rb=document.getElementById("refreshBtn"); if(rb) rb.onclick=function(){ toast("Refreshing…"); load(true).then(function(){ if(!state.msg) toast("Up to date"); }); }; }
function refreshLive(){ var l=document.getElementById("liveLine"); if(!l) return; var b=l.nextElementSibling; if(b&&b.classList.contains("banner")) b.parentNode.removeChild(b); var tmp=document.createElement("div"); tmp.innerHTML=liveLine(); while(tmp.lastChild) l.parentNode.insertBefore(tmp.lastChild,l.nextSibling); l.parentNode.removeChild(l); wireRefresh(); }
function updateBadge(){ var b=document.getElementById("openBadge"); var n=data? data[cur].tags.filter(function(t){return t.ordered===false;}).length : 0; b.hidden=!n; b.textContent=n; }
/** New data arrived: refresh lists without wiping a form someone is filling in. */
function onData(){ updateBadge(); chrome();
  if(curView==="inventory"&&document.getElementById("xfForm")){ drawInv(); drawCheck(); refreshLive(); return; }
  if(curView==="install"&&document.getElementById("inForm")){ drawInstalled(); refreshLive(); return; }
  if(curView==="tags"&&document.getElementById("logForm")){ drawTags(); refreshLive(); return; }
  render(); }

/* sign-in */
function viewSignIn(){
  var msg=state.msg?'<div class="banner">'+esc(state.msg)+'</div>':'';
  if(signStep==="email"){
    app.innerHTML=msg+'<form class="state signin" id="siForm" novalidate><h2>Sign in</h2><p>Enter your Serracom email. We\'ll email you a 6-digit code. You only do this once on each phone.</p>'+
      '<label for="siEmail">Work email</label><input id="siEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@serracom.com" value="'+esc(signEmail)+'">'+
      '<span class="hint err" id="siErr"></span><button class="btn red" type="submit" id="siBtn">Email me a code</button></form>';
    document.getElementById("siForm").addEventListener("submit",function(e){ e.preventDefault();
      var em=S(document.getElementById("siEmail").value).toLowerCase(), er=document.getElementById("siErr"), btn=document.getElementById("siBtn");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ er.textContent="Enter your full work email."; return; }
      btn.disabled=true; btn.textContent="Sending…"; er.textContent="";

function go(v){ if(v==="log") v="tags"; if(v==="spares") v="inventory"; if(!VIEWS[v]) v="dashboard"; curView=v; [].forEach.call(document.querySelectorAll(".tabs button"),function(b){ b.setAttribute("aria-current",b.dataset.view===v?"page":"false"); }); render(); window.scrollTo(0,0); }
document.querySelector(".tabs").addEventListener("click",function(e){ var b=e.target.closest("button[data-view]"); if(b&&state.phase!=="signin") go(b.dataset.view); });
function paintMarket(){ [].forEach.call(document.querySelectorAll("#mktSwitch button"),function(b){ b.setAttribute("aria-pressed",b.dataset.m===cur); }); }
document.getElementById("mktSwitch").addEventListener("click",function(e){ var b=e.target.closest("button[data-m]"); if(!b||b.dataset.m===cur) return; cur=b.dataset.m; store.set("rtt-market",cur); paintMarket(); render(); });
paintMarket();
go("dashboard");
load();
window.__rtt={build:build,flags:flags,readSlanted:readSlanted,setData:function(r){ raw=r; user=r.user||user; isMgr=!!user&&user.role==="MANAGER"; data=build(r); lastLoad=Date.now(); state={phase:"ready",msg:""}; render(); }};
})();
